<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ejemplos de test sobre el mejor modelo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        max-width: 960px;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      p {
        margin-top: 0.25rem;
        margin-bottom: 1.5rem;
      }
      #test-image-preview {
        margin-top: 16px;
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      #test-image-preview h3 {
        margin-bottom: 0.5rem;
      }
      #original-image,
      #resized-canvas {
        border: 1px solid #ccc;
        display: none;
      }
      #original-image {
        max-width: 720px;
      }
      #resized-canvas {
        image-rendering: pixelated;
        width: 96px;
        height: 96px;
      }
      .actions-row {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
      }
      button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s ease;
        background: #0b6efd;
        color: #fff;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      #prediction-result {
        flex: 1;
        min-width: 240px;
        padding: 12px 16px;
        border: 1px dashed #bbb;
        border-radius: 8px;
        background: #f8f9fa;
        display: none;
      }
      #prediction-result strong {
        font-size: 1.1rem;
      }
      a {
        color: #0b6efd;
      }
      .back-link {
        display: inline-block;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Ejemplos de test sobre el mejor modelo</h1>
    <p>
      Cargá una imagen en formato PNG o JPG y la redimensionaremos a 32×32 para inspeccionarla antes de
      enviarla al modelo.
    </p>

    <label>
      <strong>Imagen de prueba:</strong>
      <input type="file" id="test-image-input" accept="image/png,image/jpeg" />
    </label>

    <div id="test-image-preview">
      <div>
        <h3>Original</h3>
        <img id="original-image" alt="Original" />
      </div>
      <div>
        <h3>Redimensionada (32×32)</h3>
        <canvas id="resized-canvas" width="32" height="32"></canvas>
      </div>
    </div>

    <div class="actions-row">
      <button id="predict-btn" type="button" disabled>🔍 Clasificar</button>
      <div id="prediction-result"></div>
    </div>

    <a class="back-link" href="index.html">← Volver al tablero principal</a>

    <script>
      const testImageInput = document.getElementById('test-image-input');
      const originalImageEl = document.getElementById('original-image');
      const resizedCanvas = document.getElementById('resized-canvas');
      const predictBtn = document.getElementById('predict-btn');
      const predictionResult = document.getElementById('prediction-result');
      const API_URL = 'http://localhost:8002/classify';

      testImageInput.addEventListener('change', event => {
        const file = event.target.files?.[0];
        if (!file) return;
        if (!/^image\/(png|jpeg)$/.test(file.type)) {
          alert('Por favor cargá un archivo PNG o JPG válido.');
          event.target.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = e => {
          const dataUrl = e.target?.result;
          if (typeof dataUrl !== 'string') return;

          const img = new Image();
          img.onload = () => {
            originalImageEl.src = dataUrl;
            originalImageEl.style.display = 'block';

            const ctx = resizedCanvas.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, 32, 32);
            ctx.drawImage(img, 0, 0, 32, 32);
            resizedCanvas.style.display = 'block';
            predictBtn.disabled = false;
            predictionResult.style.display = 'none';
            predictionResult.textContent = '';
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
      });

      async function classifyImage() {
        const ctx = resizedCanvas.getContext('2d');
        if (!ctx) return;

        const dataUrl = resizedCanvas.toDataURL('image/png');
        predictionResult.style.display = 'block';
        predictionResult.innerHTML = '<strong>Procesando...</strong> Enviando al modelo...';

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: dataUrl })
          });

          if (!response.ok) {
            throw new Error('Error en la respuesta del servidor');
          }

          const result = await response.json();
          const confidence = (result.confidence * 100).toFixed(2);
          predictionResult.innerHTML = `
            <strong>Clase:</strong> ${result.label} ${result.emoji}<br />
            <strong>Confianza:</strong> ${confidence}%
          `;
        } catch (error) {
          console.error('Prediction error:', error);
          predictionResult.innerHTML =
            '<strong>Error:</strong> No pudimos obtener una clasificación. Verificá que la API esté corriendo en el puerto 8002.';
        }
      }

      predictBtn.addEventListener('click', () => {
        classifyImage();
      });
    </script>
  </body>
</html>
